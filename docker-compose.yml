version: "3.7"

# ─────────────────────────────────────────────────────────────────────────────
# Central Mailer — backend + frontend only.
# MongoDB and Redis are hosted (Atlas / hosted Redis), wired up via .env.
#
# Required in .env:
#   MONGODB_URI       (Atlas URI, e.g. mongodb+srv://...)
#   REDIS_HOST        (your hosted Redis hostname — not 127.0.0.1)
#   REDIS_PORT        (usually 6379)
#   REDIS_PASSWORD    (your hosted Redis password)
#   ENCRYPTION_KEY    (32-byte hex; openssl rand -hex 32)
#   JWT_SECRET        (long random string; openssl rand -base64 48)
#
# Run:   docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      context: .
      target: backend
    image: central-mailer-backend:latest
    container_name: central-mailer-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # — runtime config (hard-coded sensible defaults) —
      PORT: "8080"
      RUST_LOG: "info,central_mailer_backend=debug"
      MONGODB_DATABASE: "central_mailer"
      MONGODB_MAX_POOL: "50"
      JWT_EXPIRY_HOURS: "24"
      DEFAULT_DAILY_LIMIT: "500"
      MAX_TRANSPORTS_PER_USER: "10"
      MAX_TEMPLATES_PER_USER: "50"
      MAX_HTML_BYTES: "1048576"
      MAX_SUBJECT_CHARS: "998"
      LOG_RETENTION_DAYS: "90"
      DASHBOARD_ORIGIN: "http://localhost:3000"
      REQUIRE_HTTPS: "false"

      # — connection strings & secrets (must be in .env) —
      MONGODB_URI: ${MONGODB_URI}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - mailnet

  frontend:
    build:
      context: .
      target: frontend
    image: central-mailer-frontend:latest
    container_name: central-mailer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      FRONTEND_PORT: "3000"
      RUST_LOG: "info,central_mailer_frontend=debug"
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend
    networks:
      - mailnet

networks:
  mailnet:
    driver: bridge
