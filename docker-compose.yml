# ─────────────────────────────────────────────────────────────────────────────
# Full local stack: Mongo + Redis + Axum API + Leptos SSR dashboard.
#
# Two usage modes:
#
#   1. Hosted DB (e.g. MongoDB Atlas + hosted Redis) — DEFAULT
#      cp .env.example .env       # set MONGODB_URI, REDIS_HOST/PORT/PASSWORD
#      docker-compose up --build
#      (the `mongo` and `redis` services are profile-gated, so they DON'T start)
#
#   2. Fully local — opt-in via the `local` profile
#      docker-compose --profile local up --build
#      (brings up mongo + redis containers in addition to the app)
#
# Required secrets in .env: ENCRYPTION_KEY (32-byte hex), JWT_SECRET, MONGODB_URI.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Optional local MongoDB (use --profile local) ──────────────────────────
  mongo:
    profiles: ["local"]
    image: mongo:7
    container_name: central-mailer-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mailnet

  # ── Optional local Redis (use --profile local) ────────────────────────────
  redis:
    profiles: ["local"]
    image: redis:7-alpine
    container_name: central-mailer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mailnet

  # ── Axum API server ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      target: backend
      args:
        RUST_VERSION: "1.83"
    image: central-mailer-backend:latest
    container_name: central-mailer-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info,central_mailer_backend=debug}

      # MongoDB — Atlas URI from .env, or local mongo if --profile local is active.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set (Atlas URI or mongodb://...)}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-central_mailer}
      MONGODB_MAX_POOL: ${MONGODB_MAX_POOL:-50}

      # Redis — hosted host/port/password from .env, or local redis if --profile local.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Required secrets — fail-fast if missing.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (32-byte hex)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}

      # Limits
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT:-500}
      MAX_TRANSPORTS_PER_USER: ${MAX_TRANSPORTS_PER_USER:-10}
      MAX_TEMPLATES_PER_USER: ${MAX_TEMPLATES_PER_USER:-50}
      MAX_HTML_BYTES: ${MAX_HTML_BYTES:-1048576}
      MAX_SUBJECT_CHARS: ${MAX_SUBJECT_CHARS:-998}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}

      # Frontend / CORS
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
    networks:
      - mailnet

  # ── Leptos SSR dashboard ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      target: frontend
      args:
        RUST_VERSION: "1.83"
    image: central-mailer-frontend:latest
    container_name: central-mailer-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      FRONTEND_PORT: 3000
      RUST_LOG: ${RUST_LOG:-info,central_mailer_frontend=debug}
      BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    depends_on:
      - backend
    networks:
      - mailnet

volumes:
  mongo_data:
  redis_data:

networks:
  mailnet:
    driver: bridge
