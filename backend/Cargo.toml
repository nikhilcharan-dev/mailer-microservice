[package]
name = "central-mailer-backend"
edition.workspace = true
version.workspace = true

[[bin]]
name = "central-mailer"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit", "trace", "timeout"] }

mongodb = "2.8"

redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "script"] }

lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }

handlebars = "6"
aes-gcm = "0.10"
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
hex = "0.4"
regex = "1"
once_cell = "1"
dotenvy = "0.15"
subtle = "2"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
